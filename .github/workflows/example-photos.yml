name: Acquire verified CC0 example photos
on:
  push:
    branches: [fix/example-photos]
    paths: ['docs/example-photos.json', '.github/workflows/example-photos.yml']
permissions:
  contents: read
jobs:
  photos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download the exact attributed sources
        run: |
          python3 - <<'PY'
          import json, subprocess, pathlib, base64
          from PIL import Image
          folder=pathlib.Path('photos');folder.mkdir()
          for p in json.load(open('docs/example-photos.json')):
            dest=folder/p['file']
            subprocess.run(['curl','--fail','--location','--retry','2','--max-time','60','-A','RamaStudioExample/1.0 (CC0 website template)',p['download'],'-o',str(dest)],check=True)
            im=Image.open(dest).convert('RGB');im.thumbnail((1100,900));im.save(dest,quality=82,optimize=True)
            print('PHOTO_START '+p['file'],flush=True)
            print(base64.b64encode(dest.read_bytes()).decode(),flush=True)
            print('PHOTO_END',flush=True)
          PY
