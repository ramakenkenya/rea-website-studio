name: Rebuild and verify the photo-backed example
on:
  push:
    branches: [fix/example-photos]
    paths: ['scripts/create-completed-example.py', 'docs/rama-living-example.json', 'docs/example-photos.json', 'public/example-photos/**', '.github/workflows/rebuild-example.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  example:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install document build dependencies
        run: python3 -m pip install python-docx==1.2.0 reportlab==4.4.5 pypdf==6.1.3 Pillow==11.3.0
      - name: Rebuild the matched Word, interactive PDF and ZIP
        run: python3 scripts/create-completed-example.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: python3 -m unittest discover -s tests -v
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: completed-example-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      - name: Save verified downloads on this branch
        run: |
          git add public/templates/Rama_Living_Completed_Example.docx public/templates/Rama_Living_Completed_Example.pdf public/templates/Rama_Living_Completed_Examples.zip public/example-photos/CREDITS.txt
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Rebuild verified photo-backed Word and PDF examples'
            git push origin HEAD
          fi
